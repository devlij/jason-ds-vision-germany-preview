name: R2 Connectivity Test
on:
  workflow_dispatch:

jobs:
  test-r2:
    runs-on: ubuntu-latest
    steps:
      - name: Test R2 S3 connectivity
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          pip install -q boto3
          python3 << 'PYEOF'
          import boto3, os, sys
          try:
              s3 = boto3.client('s3',
                  endpoint_url='https://bad0a8d58eeec803fc2043743a11fb73.r2.cloudflarestorage.com',
                  aws_access_key_id=os.environ['AWS_ACCESS_KEY_ID'],
                  aws_secret_access_key=os.environ['AWS_SECRET_ACCESS_KEY'],
                  region_name='auto')
              # Bucket-scoped token: test via ListObjects on the Germany bucket
              objs = s3.list_objects_v2(Bucket='jdvision-germany-assets', MaxKeys=5)
              count = objs.get('KeyCount', 0)
              print(f"R2 CONNECTIVITY: SUCCESS - Germany bucket accessible, {count} objects")
              for obj in objs.get('Contents', [])[:3]:
                  print(f"  {obj['Key']} ({obj['Size']} bytes)")
          except Exception as e:
              print(f"R2 CONNECTIVITY: FAILED - {type(e).__name__}: {str(e)[:200]}")
              sys.exit(1)
          PYEOF
